[project]
name = "connectwise-mcp"
version = "0.1.0"
description = "Read-only MCP server that lets Claude query ConnectWise PSA (Manage)"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
connectwise-mcp = "connectwise_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectwise_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
